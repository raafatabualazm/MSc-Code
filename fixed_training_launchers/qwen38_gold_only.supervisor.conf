[program:qwen38_gold_only]
environment=PROC_NAME="%(program_name)s",QWEN_GOLD_ONLY="1"
command=/opt/supervisor-scripts/qwen38_gold_only.sh
directory=/workspace
autostart=false
autorestart=false
startsecs=1
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
