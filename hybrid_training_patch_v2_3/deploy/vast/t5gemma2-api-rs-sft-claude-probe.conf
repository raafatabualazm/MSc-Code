[program:t5gemma-api-rs-sft-claude-probe]
command=/opt/supervisor-scripts/t5gemma2_api_rs_sft_claude_probe.sh
directory=/workspace/hybrid_training_patch_v2_3
autostart=false
autorestart=unexpected
exitcodes=0,78
startsecs=5
startretries=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/workspace/logs/t5gemma-api-rs-sft-claude-probe.log
stdout_logfile_maxbytes=25MB
stdout_logfile_backups=2
environment=PYTHONUNBUFFERED="1"
