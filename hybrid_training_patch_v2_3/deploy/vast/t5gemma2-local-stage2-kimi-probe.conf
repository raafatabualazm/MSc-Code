[program:t5gemma-local-stage2-kimi-probe]
command=/opt/supervisor-scripts/t5gemma2_local_stage2_kimi_probe.sh
directory=/workspace/hybrid_training_patch_v2_3
autostart=false
autorestart=unexpected
exitcodes=0,78
startsecs=5
startretries=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/workspace/logs/t5gemma-local-stage2-kimi-probe.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=2
environment=PYTHONUNBUFFERED="1"
