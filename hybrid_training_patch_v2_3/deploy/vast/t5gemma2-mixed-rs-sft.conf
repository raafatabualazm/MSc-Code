[program:t5gemma-mixed-rs-sft]
command=/opt/supervisor-scripts/t5gemma2_mixed_rs_sft.sh
directory=/workspace/hybrid_training_patch_v2_3
autostart=false
autorestart=unexpected
exitcodes=0,78
startsecs=5
startretries=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/workspace/logs/t5gemma-mixed-rs-sft.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=2
# The only API artifact currently present is an explicitly exploratory
# prefix-10 probe. This configuration keeps the output labelled accordingly.
# Set ALLOW_EXPLORATORY_INPUTS=0 and replace API_REPORT/SHA256 with a completed
# production rescue before treating an adapter as production-floor eligible.
environment=PYTHONUNBUFFERED="1",T5GEMMA_MIXED_ALLOW_EXPLORATORY_INPUTS="1",T5GEMMA_MIXED_OUTPUT_DIR="/workspace/artifacts/t5gemma2_4b4b_mixed_rs_sft_exploratory_v1",T5GEMMA_MIXED_GOLD_REPLAY_RATIO="3",T5GEMMA_MIXED_EPOCHS="3",T5GEMMA_MIXED_LEARNING_RATE="5e-5"
