[program:t5gemma-rs-sft-pilot]
command=/opt/supervisor-scripts/t5gemma2_rs_sft_pilot.sh
directory=/workspace/hybrid_training_patch_v2_3
autostart=false
autorestart=unexpected
exitcodes=0,78
startsecs=5
startretries=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/workspace/logs/t5gemma-rs-sft-pilot.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=2
environment=PYTHONUNBUFFERED="1"
