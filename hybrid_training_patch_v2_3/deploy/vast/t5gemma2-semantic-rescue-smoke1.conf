[program:t5gemma-semantic-rescue-smoke1]
command=/opt/supervisor-scripts/t5gemma2_semantic_rescue_ablation.sh
directory=/workspace/hybrid_training_patch_v2_3
autostart=false
autorestart=unexpected
exitcodes=0,78
startsecs=5
startretries=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/workspace/logs/t5gemma-semantic-rescue-smoke1.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=2
environment=PYTHONUNBUFFERED="1",T5GEMMA_SEMANTIC_RESCUE_GROUPS="1",T5GEMMA_SEMANTIC_RESCUE_RUN_TAG="smoke1"
