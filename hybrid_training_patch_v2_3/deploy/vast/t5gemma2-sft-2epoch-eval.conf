[program:t5gemma-sft-2epoch-eval]
command=/opt/supervisor-scripts/t5gemma2_sft_2epoch_eval.sh
directory=/workspace/hybrid_training_patch_v2_3
autostart=false
autorestart=unexpected
exitcodes=0,78
startsecs=5
startretries=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/workspace/logs/t5gemma-sft-2epoch-eval.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=2
environment=PYTHONUNBUFFERED="1",T5GEMMA_2E_TRAIN_PROGRAM="t5gemma-sft-2epoch",T5GEMMA_2E_EVAL_WAIT_INTERVAL="30",T5GEMMA_2E_EVAL_MAX_WAIT_SECONDS="86400"
