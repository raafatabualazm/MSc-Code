[program:t5gemma2-typed-holdback-alignment-audit-v1]
command=/opt/supervisor-scripts/t5gemma2_typed_holdback_alignment_audit_v1.sh
directory=/workspace
autostart=false
autorestart=unexpected
startsecs=2
startretries=2
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/workspace/logs/t5gemma2-typed-holdback-alignment-audit-v1.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
stderr_logfile=/workspace/logs/t5gemma2-typed-holdback-alignment-audit-v1.err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=2
environment=PYTHONUNBUFFERED="1",TOKENIZERS_PARALLELISM="false",CUDA_VISIBLE_DEVICES="-1"
