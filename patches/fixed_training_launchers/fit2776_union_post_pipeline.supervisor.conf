[program:fit2776_union_post_pipeline]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/fit2776_union_post_pipeline.sh
directory=/workspace
autostart=false
autorestart=unexpected
startsecs=1
startretries=100
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
