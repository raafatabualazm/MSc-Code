[program:t5gemma-base-harvest-residual-2epoch]
command=/opt/supervisor-scripts/t5gemma2_base_residual_harvest_2epoch.sh
directory=/workspace/hybrid_training_patch_v2_3
autostart=false
autorestart=unexpected
exitcodes=0,78
startsecs=5
startretries=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/workspace/logs/t5gemma-base-harvest-residual-2epoch.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=2

# Fill the two blank remaining-stage SHA variables only after the active remaining1186x4
# harvest publishes its immutable report and journal.  The launcher fails
# closed until then, so this service cannot accidentally consume a partial run.
environment=PYTHONUNBUFFERED="1",T5GEMMA_RESIDUAL_REMAINING_REPORT_SHA="",T5GEMMA_RESIDUAL_REMAINING_JOURNAL_SHA="",T5GEMMA_RESIDUAL_OUTPUT_DIR="/workspace/artifacts/t5gemma2_local_base_residual_unresolved4_v1"
