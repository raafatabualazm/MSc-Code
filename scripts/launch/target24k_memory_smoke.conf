[program:target24k_memory_smoke]
command=/opt/supervisor-scripts/target24k_memory_smoke.sh
directory=/workspace
autostart=false
autorestart=false
startsecs=1
startretries=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
